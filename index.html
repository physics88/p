    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #eef2f6 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem 1rem;
        }

        .wrapper {
            max-width: 1300px;
            width: 100%;
        }

        /* приветственный экран */
        .welcome-screen {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 3.5rem;
            box-shadow: 0 30px 60px rgba(0,15,30,0.15);
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .welcome-screen h1 {
            font-size: 4rem;
            font-weight: 350;
            background: linear-gradient(145deg, #162b40, #1f3a57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.2rem;
            letter-spacing: -1px;
        }

        .welcome-screen p {
            font-size: 1.5rem;
            color: #1f3a57;
            margin-bottom: 2.5rem;
            opacity: 0.8;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            background: #1f3a57;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 500;
            padding: 1rem 4rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 15px 25px rgba(0,30,50,0.2);
            transition: 0.2s;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn:hover {
            background: #0e263b;
            transform: translateY(-3px);
            box-shadow: 0 25px 35px rgba(0,30,50,0.3);
        }

        /* панель навигации по главам */
        .nav-panel {
            display: none;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            padding: 1.2rem 2rem;
            border-radius: 60px;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
        }

        .nav-panel.visible {
            display: flex;
        }

        .nav-chapter {
            background: none;
            border: none;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            color: #1f3a57;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .nav-chapter:hover {
            background: rgba(31,58,87,0.1);
            border-color: #9bb7d4;
        }

        .nav-chapter.active {
            background: #1f3a57;
            color: white;
            box-shadow: 0 5px 15px rgba(0,50,80,0.3);
        }

        /* контейнер с главами */
        .chapters-container {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            width: 100%;
        }

        .chapters-container.visible {
            display: block;
            opacity: 1;
        }

        /* карточка главы */
        .chapter {
            background: white;
            border-radius: 2.5rem;
            padding: 2rem 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(74,111,165,0.3);
            width: 100%;
            transition: box-shadow 0.2s;
            scroll-margin-top: 2rem;
        }

        .chapter h2 {
            font-size: 2.5rem;
            font-weight: 350;
            color: #162b40;
            border-left: 12px solid #4a6fa5;
            padding-left: 1.8rem;
            margin-bottom: 1.5rem;
            margin-top: 0.2rem;
        }

        /* оглавление внутри главы (ссылки на темы) */
        .chapter-toc {
            background: #e5effb;
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            align-items: center;
            border: 1px solid #4a6fa5;
        }

        .chapter-toc span {
            font-weight: 600;
            color: #1f3a57;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .toc-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.8rem;
        }

        .toc-links a {
            color: #0a2a44;
            text-decoration: none;
            font-size: 1.1rem;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .toc-links a:hover {
            border-bottom-color: #1f3a57;
            color: #000;
        }

        .topics-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .topic-card {
            background: #f5faff;
            border-radius: 2rem;
            padding: 1.8rem 2.2rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01), 0 8px 20px rgba(0,20,50,0.05);
            border: 1px solid rgba(74,111,165,0.2);
            transition: 0.2s;
            width: 100%;
            scroll-margin-top: 5rem;
        }

        .topic-card:hover {
            border-color: #4a6fa5;
            background: #ffffff;
        }

        .topic-title {
            font-size: 1.9rem;
            font-weight: 500;
            color: #0a233a;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topic-title span {
            background: #4a6fa5;
            color: white;
            font-size: 1.3rem;
            font-weight: 400;
            padding: 0.2rem 1.3rem;
            border-radius: 60px;
        }

        .explanation {
            font-size: 1.1rem;
            line-height: 1.65;
            color: #102433;
            background: rgba(255,255,255,0.8);
            padding: 1.4rem 1.8rem;
            border-radius: 1.8rem;
            margin: 1.2rem 0 1.5rem 0;
            white-space: pre-line;
            border: 1px solid #e0edfe;
        }

        /* блок с картинками */
        .images-section {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            background: #e5effb;
            border-radius: 2rem;
            padding: 2rem 2rem;
            margin-top: 1rem;
            justify-content: flex-start;
        }

        .image-placeholder {
            background: #b9d3f0;
            border-radius: 1.5rem;
            padding: 1.2rem 2rem;
            color: #0f2f50;
            font-weight: 500;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            border: 3px dashed #1f4b7a;
        }

        .images-section img {
            max-width: 280px;
            max-height: 210px;
            width: auto;
            height: auto;
            border-radius: 2rem;
            box-shadow: 0 15px 30px rgba(0,30,60,0.3);
            object-fit: cover;
            border: 4px solid white;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .images-section img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 35px rgba(0,30,70,0.4);
        }

        /* кнопка "наверх" */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #1f3a57;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 3px solid white;
            transition: 0.2s;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            background: #0e2a42;
            transform: scale(1.1);
        }

        /* модальное окно для увеличения картинок */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 2rem;
            border: 4px solid white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            border: 2px solid white;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        /* адаптивность */
        @media (max-width: 700px) {
            .chapter { padding: 1.5rem 1.2rem; }
            .topic-card { padding: 1.2rem 1rem; }
            .images-section img { max-width: 100%; height: auto; }
            .nav-panel { gap: 0.5rem; }
            .nav-chapter { font-size: 1rem; padding: 0.5rem 1rem; }
            .modal-close { top: 20px; right: 20px; font-size: 2rem; width: 50px; height: 50px; }
            .chapter-toc { flex-direction: column; align-items: flex-start; }
            .scroll-top { width: 50px; height: 50px; font-size: 2rem; bottom: 20px; right: 20px; }
        }
    </style>
</head>

<!-- кнопка "наверх" -->

<!-- модальное окно для просмотра картинок -->

<script>
(function() {
    // ---------- ТЕКСТЫ ОБЪЯСНЕНИЙ (в точности из задания) ----------
    const explanationTexts = {
        "Основные положения молекулярно-кинетической теории":
            "Молекулярно-кинетическая теория — это теория, которая объясняет свойства веществ тем, что все тела состоят из мельчайших частиц (молекул и атомов), которые постоянно движутся и взаимодействуют между собой.\n" +
            "Основные идеи МКТ:\n" +
            " 1. Все вещества состоят из частиц.\n" +
            " 2. Частицы непрерывно и хаотично движутся.\n" +
            " 3. Частицы притягиваются и отталкиваются.\n" +
            "   Из-за этого движения и взаимодействия вещества могут быть твёрдыми, жидкими или газообразными. В твёрдых телах частицы колеблются около своих мест, в жидкостях они могут менять соседей, а в газах свободно летают. Существование частиц доказывается броуновским движением: под микроскопом видно, как мелкие частицы в жидкости двигаются беспорядочно из-за ударов молекул. Самый наглядный пример — распространение запахов. Когда открывают флакон духов, запах постепенно заполняет комнату, потому что молекулы газа движутся и смешиваются с воздухом. По тем же причинам растворяется сахар в чае, нагревается воздух в шарике и испаряется вода.",

        "Строение газообразных, жидких и твердых тел":
            "Все вещества состоят из частиц (атомов и молекул), которые расположены и движутся по-разному в газах, жидкостях и твёрдых телах.\n" +
            "В твёрдых телах частицы плотно прижаты друг к другу и лишь колеблются около своих мест, поэтому тело сохраняет форму. В жидкостях частицы близко, но могут перемещаться — из-за этого жидкость принимает форму сосуда. В газах частицы далеко друг от друга и свободно движутся во всех направлениях, поэтому газ заполняет весь объём.\n" +
            "Такое строение подтверждается сжимаемостью газов, текучестью жидкостей и прочностью твёрдых тел.\n" +
            "Самый понятный пример — воздух в шарике: он легко сжимается и заполняет форму шара. Вода разливается по стакану, а лёд сохраняет свою форму.",

        "Смачивание и капилярность. Поверхностное натяжение":
            "Поверхностное натяжение — это свойство жидкости стремиться уменьшить площадь своей поверхности. Смачивание показывает, растекается ли жидкость по поверхности твёрдого тела или собирается в капли.\n" +
            "Молекулы жидкости сильнее притягиваются друг к другу, чем к воздуху, поэтому поверхность как бы натянута, словно плёнка. Если притяжение к поверхности сильное — жидкость растекается (смачивает), если слабое — образуются капли.\n" +
            "Из-за этого возникает капиллярность — подъём жидкости в тонких трубках.\n" +
            "Самый наглядный пример — вода поднимается в бумажной салфетке или в фитиле свечи. Также капли росы на листьях и растекание воды по стеклу.",

        "Температура и тепловое движение молекул. Устройство градусника.":
            "Температура — это величина, показывающая, насколько быстро движутся молекулы вещества.\n" +
            "Чем быстрее движутся молекулы, тем выше температура тела. При нагревании движение усиливается, при охлаждении замедляется. Это доказывается расширением тел при нагревании — частицы начинают сильнее отталкиваться.\n" +
            "Градусник работает на этом принципе: жидкость внутри (ртуть или спирт) при нагревании расширяется и поднимается по трубке, показывая температуру.\n" +
            "Когда чай остывает, молекулы начинают двигаться медленнее. Воздух в жару расширяется, поэтому шарики становятся больше.",

        "Температурные шкалы.":
            "Температурная шкала — это способ измерения температуры с помощью выбранных опорных точек.\n" +
            "В шкале Цельсия за 0°C принимают температуру таяния льда, а за 100°C — кипение воды при нормальном давлении. Между ними расстояние делят на 100 равных частей.\n" +
            "Существует и шкала Кельвина, где отсчёт начинается от абсолютного нуля — самой низкой возможной температуры.\n" +
            "Связь шкал: T (К) = t(°C) + 273\n" +
            "Мы постоянно пользуемся градусами Цельсия — на термометре за окном, в прогнозе погоды, при измерении температуры тела.",

        "Внутренняя энергия. Способы изменения внутренней энергии.":
            "Внутренняя энергия — это энергия движения молекул и их взаимодействия друг с другом внутри тела.\n" +
            "Чем выше температура, тем больше внутренняя энергия, потому что частицы движутся быстрее. Также она зависит от расстояния между частицами — например, в газе энергии больше, чем в твёрдом теле при той же температуре.\n" +
            "Изменить внутреннюю энергию можно двумя способами:\n" +
            " 1. Нагреванием или охлаждением (теплопередачей)\n" +
            " 2. Совершением работы (сжатие газа, трение)\n" +
            "   Самый понятный пример — нагрев воды на плите: она получает энергию и становится горячей. Также ладони нагреваются при трении друг о друга.",

        "Теплопередача":
            "Теплопередача — это процесс передачи внутренней энергии от более тёплого тела к более холодному.\n" +
            "Она происходит тремя способами: теплопроводностью, конвекцией и излучением.\n" +
            "При теплопроводности энергия передаётся от частицы к частице (например, в металле).\n" +
            "При конвекции тёплые слои жидкости или газа поднимаются вверх, а холодные опускаются вниз.\n" +
            "Излучение происходит без вещества — с помощью тепловых лучей.\n" +
            "Тепло всегда идёт от горячего к холодному, пока температуры не сравняются.\n" +
            "Ложка нагревается в горячем чае, воздух в комнате перемешивается при работе батареи, а Солнце согревает Землю лучами.",

        "Количество теплоты":
            "Количество теплоты — это энергия, которую тело получает или отдаёт при нагревании или охлаждении.\n" +
            "Оно зависит от массы тела, изменения температуры и вещества. Это выражается формулой:\n" +
            "Q = c·m·Δt\n" +
            "где Q — количество теплоты (Дж), c — удельная теплоёмкость вещества (Дж/(кг·°C), m — масса (кг), Δt — изменение температуры (°C).\n" +
            "Формула показывает: чем тяжелее тело и чем больше его нагревают, тем больше энергии нужно.\n" +
            "Самый понятный пример — нагрев воды в чайнике: чтобы нагреть полный чайник, требуется больше энергии, чем кружку.",

        "Удельная теплоемкость.":
            "Удельная теплоёмкость — это количество теплоты, нужное для нагревания 1 кг вещества на 1 °C.\n" +
            "Каждое вещество нагревается по-разному. Вода требует много энергии, а металл — значительно меньше.\n" +
            "Большое значение c означает, что вещество трудно нагреть и трудно охладить.\n" +
            "Вода долго нагревается и долго остывает, поэтому моря смягчают климат. Сковорода нагревается быстро, потому что металл имеет маленькую теплоёмкость.",

        "Тепловой баланс.":
            "Тепловой баланс — это равенство между количеством теплоты, которое отдают горячие тела, и количеством теплоты, которое получают холодные.\n" +
            "Записывается так: Qотданное = Qполученное\n" +
            "Это основано на сохранении энергии: тепло не исчезает, а переходит от одного тела к другому.\n" +
            "Если в горячий чай добавить холодную воду, напиток станет тёплым — тепло распределится между жидкостями. Так же происходит при охлаждении супа.",

        "Плавление и отвердевание кристаллических тел.":
            "Плавление — это переход твёрдого тела в жидкое состояние при нагревании, а отвердевание — обратный процесс.\n" +
            "Во время плавления температура не меняется, хотя тепло продолжает поступать. Энергия тратится на разрушение связей между частицами.\n" +
            "Количество теплоты определяется формулой: Q = λ·m\n" +
            "где Q — количество теплоты (Дж), λ — удельная теплота плавления (Дж/кг), m — масса тела (кг).\n" +
            "Самый понятный пример — таяние льда в стакане. Также плавится воск свечи, металл в печах и шоколад на солнце.",

        "Количество теплоты, выделенное при сгорании топлива.":
            "Количество теплоты при сгорании топлива — это энергия, которая выделяется при полном сгорании вещества и измеряется в джоулях (Дж).\n" +
            "Она зависит от массы топлива (в килограммах) и его вида. Для этого вводят удельную теплоту сгорания — энергию, выделяемую при сгорании 1 кг топлива, измеряемую в Дж/кг. Её значение всегда берут из справочной таблицы.\n" +
            "Формула: Q = q·m\n" +
            "где Q — количество теплоты (Дж), q — удельная теплота сгорания (Дж/кг), m — масса топлива (кг).\n" +
            "Самый частый пример — сгорание бензина в двигателе автомобиля. Также дрова в печи, газ на плите и уголь на электростанциях.",

        "Количество теплоты, выделенное при кипении или конденсации.":
            "Парообразование (испарение) — это переход жидкости в газ, происходящий постоянно при любой температуре, а конденсация — обратный процесс.\n" +
            "Для превращения жидкости в пар требуется энергия, измеряемая в джоулях. Она идёт на разрыв связей между молекулами. Чем выше температура, площадь поверхности и движение воздуха, тем быстрее идёт испарение.\n" +
            "Формула: Q = r·m\n" +
            "где Q — количество теплоты (Дж), r — удельная теплота парообразования (Дж/кг, берётся из таблицы), m — масса жидкости (кг).\n" +
            "При конденсации это же количество теплоты выделяется.\n" +
            "Самый заметный пример — высыхание луж и одежды. Также образование пара в чайнике и капли воды на холодных окнах.",

        "Тепловая мощность.":
            "Тепловая мощность — это количество теплоты, передаваемое за одну секунду, и измеряется в ваттах (Вт), где 1 Вт = 1 Дж/с.\n" +
            "Она показывает скорость передачи энергии, а не её общий запас.\n" +
            "Формула: P = Q / t\n" +
            "где P — мощность (Вт), Q — теплота (Дж), t — время (с).\n" +
            "Мощность указана на чайниках, обогревателях и плитах — чем она больше, тем быстрее идёт нагрев.",

        "Влажность воздуха.":
            "Влажность воздуха — это содержание водяного пара в воздухе.\n" +
            "Относительная влажность показывает степень насыщения и измеряется в процентах (%):\n" +
            "φ = (ρ / ρ₀) · 100%\n" +
            "где ρ — плотность водяного пара в воздухе (кг/м³), ρ₀ — максимальная плотность при данной температуре (кг/м³, берётся из таблицы).\n" +
            "Тёплый воздух может содержать больше пара, чем холодный.\n" +
            "Её указывают в прогнозе погоды. При высокой влажности тяжелее переносится жара, при низкой быстрее сохнут вещи.",

        "Тепловой двигатель.":
            "Тепловой двигатель — это устройство, превращающее теплоту (в джоулях) в механическую работу (тоже в джоулях).\n" +
            "Он получает энергию от нагревателя, часть отдаёт окружающей среде и часть превращает в движение. Это происходит из-за расширения нагретого газа или пара.\n" +
            "Количество полученной и отданной энергии измеряют в джоулях, а мощность двигателя — в ваттах.\n" +
            "Двигатель автомобиля, турбины электростанций, дизельные и паровые машины.",

        "Коэффицент полезного действия теплового двигателя.":
            "Коэффициент полезного действия показывает, какая часть полученной тепловой энергии превращается в полезную работу.\n" +
            "Он равен отношению полезной работы к количеству теплоты, полученной от нагревателя:\n" +
            "η = (A / Q₁) · 100%\n" +
            "где η — КПД (в процентах), A — полезная работа (Дж), Q₁ — полученное тепло (Дж).\n" +
            "Часть энергии всегда теряется и уходит в окружающую среду, поэтому КПД никогда не бывает 100%. Это подтверждается работой всех реальных двигателей.\n" +
            "КПД указывают для автомобилей, электростанций и двигателей — чем он выше, тем меньше топлива тратится.",

        "Закон сохранения и превращения энергии.":
            "Закон сохранения энергии гласит: энергия не исчезает и не появляется из ниоткуда, она только переходит из одного вида в другой.\n" +
            "Полная энергия системы остаётся постоянной. Например, механическая энергия может превращаться в тепловую, электрическая — в световую.\n" +
            "Записывают так: E₁ = E₂ или изменение одной энергии равно изменению другой.\n" +
            "Это подтверждается опытами: при трении движение исчезает, но появляется тепло, измеряемое в джоулях.\n" +
            "Тормоза автомобиля нагреваются при остановке, лампа превращает электричество в свет и тепло, мяч при падении разгоняется за счёт энергии высоты.",

        "Электризация.":
            "Электризация — это процесс, при котором тела приобретают электрический заряд.\n" +
            "Она происходит из-за перехода электронов от одного тела к другому. При этом одно тело получает избыток электронов (отрицательный заряд), а другое — их недостаток (положительный заряд).\n" +
            "Заряд измеряется в кулонах (Кл). Он не создаётся заново, а перераспределяется между телами, что доказывается опытами с натиранием и соприкосновением тел.\n" +
            "Самый известный пример — наэлектризованная расчёска притягивает бумажки. Также искры при снятии синтетической одежды.",

        "Взаимодействие заряженных тел.":
            "Взаимодействие заряженных тел — это их притяжение или отталкивание в зависимости от знаков зарядов.\n" +
            "Одноимённые заряды отталкиваются, разноимённые притягиваются. Это наблюдается всегда и подтверждается множеством опытов.\n" +
            "Сила взаимодействия измеряется в ньютонах (Н) и зависит от величины зарядов и расстояния между ними, что позже точно описывает закон Кулона.\n" +
            "Наэлектризованные шарики могут отталкиваться друг от друга, а бумажки притягиваться к заряженной палочке.",

        "Закон Кулона.":
            "Закон Кулона показывает, с какой силой взаимодействуют два неподвижных заряда.\n" +
            "Формула: F = k · |q₁·q₂| / r²\n" +
            "где F — сила (Н), q₁ и q₂ — заряды (Кл), r — расстояние между ними (м), k — коэффициент (постоянная величина).\n" +
            "Сила увеличивается при больших зарядах и резко уменьшается при увеличении расстояния.\n" +
            "Именно по этому закону наэлектризованные предметы притягивают или отталкивают друг друга, что видно в школьных опытах.",

        "Электрическое поле. Напряженность электрического поля.":
            "Электрическое поле — это область вокруг заряженного тела, в которой на другие заряды действует сила. Напряжённость поля показывает, какую силу испытывает единичный положительный заряд в этой точке.\n" +
            "Формула: E = F / q\n" +
            "где E — напряжённость (Н/Кл), F — сила (Н), q — заряд (Кл).\n" +
            "Принцип работы: положительный заряд создаёт поле, которое толкает другие положительные заряды и притягивает отрицательные. Ток течёт от области с большим потенциалом к меньшему, потому что электроны движутся к положительному заряду, а направление условно берём от + к −.\n" +
            "Ток в проводах течёт именно из-за существования поля. В грозовом облаке электрическое поле заставляет молнии двигаться от облака к земле.",

        "Элементарный заряд. Строение атома.":
            "Элементарный заряд — наименьший электрический заряд, который может существовать у отдельной частицы, равен e = 1,6·10⁻¹⁹ Кл.\n" +
            "Атом состоит из ядра (протоны + нейтроны) и электронов, движущихся вокруг ядра. Количество протонов равно количеству электронов, поэтому атом нейтрален.\n" +
            "Принцип работы: все электрические явления связаны с движением электронов — они создают ток, заряжают тела и формируют электрическое поле.\n" +
            "Электричество в проводах, зарядка батареи, наэлектризованная расчёска — всё связано с элементарными зарядами.",

        "Закон сохранения электрического заряда.":
            "Общий электрический заряд в замкнутой системе остаётся постоянным.\n" +
            "Формула: q₁ + q₂ + ... + qₙ = const\n" +
            "Принцип работы: заряд может переходить между телами, но его сумма не меняется. Например, при натирании шарика о шерстяной свитер один получает отрицательный заряд, другой — положительный, сумма зарядов та же.\n" +
            "Используется в задачах на электризацию, при расчёте распределения зарядов в проводах, токопроводящих предметах.",

        "Сила тока. Амперметр.":
            "Сила тока — это физическая величина, показывающая, какой заряд проходит через поперечное сечение проводника за определённое время. Обозначается I, измеряется в амперах (А).\n" +
            "Смысл силы тока понятен из самого процесса движения зарядов: чем больше зарядов проходит за секунду, тем сильнее ток. Формула:\n" +
            "I = q / t,\n" +
            "где q — заряд (Кл), t — время (с). Эта формула следует прямо из определения: сила тока — это скорость прохождения заряда.\n" +
            "Существование тока подтверждается его действиями: провод нагревается, лампа светится, работает двигатель. Это происходит потому, что движущиеся электроны передают энергию веществу.\n" +
            "Амперметр — прибор для измерения силы тока. Его включают последовательно, чтобы весь ток проходил через него.\n" +
            "Самый понятный пример — зарядка телефона. Если через провод проходит больше ампер, зарядка идёт быстрее. Также сила тока важна в лампах, утюгах и электродвигателях.",

        "Напряжение. Вольтметр.":
            "Напряжение — это физическая величина, показывающая, какую работу электрическое поле совершает при перемещении заряда. Обозначается U, измеряется в вольтах (В).\n" +
            "Напряжение создаёт движение зарядов. Чем больше напряжение, тем сильнее «толкаются» электроны. Формула:\n" +
            "U = A / q,\n" +
            "где A — работа (Дж), q — заряд (Кл). Это означает: напряжение показывает работу на единицу заряда.\n" +
            "Существование напряжения доказывается тем, что без него ток не возникает. Например, если батарейка разряжена (напряжение почти 0), лампа не светится.\n" +
            "Вольтметр — прибор для измерения напряжения. Его подключают параллельно, чтобы измерить разность потенциалов между двумя точками.\n" +
            "Самый наглядный пример — батарейка 1,5 В. Она создаёт напряжение, которое заставляет ток течь в фонарике. Также напряжение есть в розетке, аккумуляторе и зарядных устройствах.",

        "Сопротивление.Удельное сопротивление.":
            "Сопротивление — это физическая величина, показывающая, насколько проводник мешает прохождению электрического тока. Обозначается R, измеряется в омах (Ω).\n" +
            "Сопротивление возникает потому, что электроны сталкиваются с частицами вещества. Чем больше столкновений, тем труднее течёт ток.\n" +
            "Формула:\n" +
            "R = ρ·l / S,\n" +
            "где ρ — удельное сопротивление, l — длина проводника, S — площадь сечения.\n" +
            "Удельное сопротивление (ρ) — это величина, показывающая, насколько хорошо сам материал проводит ток. Это свойство вещества.\n" +
            "Из формулы видно:\n" +
            "Чем длиннее провод, тем больше сопротивление.\n" +
            "Чем толще провод, тем меньше сопротивление.\n" +
            "Материал тоже влияет.\n" +
            "Пример — длинный тонкий провод сильнее нагревается, потому что имеет большее сопротивление. Это используется в обогревателях, лампах накаливания и плитах.",

        "Закон Ома.":
            "Закон Ома показывает связь между силой тока, напряжением и сопротивлением в электрической цепи: сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению.\n" +
            "Формула закона Ома:\n" +
            "I = U / R\n" +
            "Этот закон был установлен экспериментально Георгом Омом. Он собирал электрическую цепь с проводником и измерял ток при разных напряжениях. Оказалось:\n" +
            "1. При увеличении напряжения в 2 раза сила тока увеличивается в 2 раза → I ∝ U\n" +
            "2. При увеличении сопротивления в 2 раза сила тока уменьшается в 2 раза → I ∝ 1/R\n" +
            "Объединив эти зависимости, получили формулу: I = U / R.\n" +
            "Физический смысл такой: напряжение создаёт движение зарядов, а сопротивление мешает этому движению.\n" +
            "Самый понятный пример — лампа в фонарике. Если поставить батарейку с большим напряжением, ток увеличится и лампа будет светить ярче. Закон Ома также используется в зарядных устройствах, бытовых приборах и всей электротехнике."
    };

        "Электризация.": ["images/elektrizacia.jpg"],
        "Взаимодействие заряженных тел.": ["images/vzaim_zaryadov.jpg"],
        "Закон Кулона.": ["images/kulon.jpg"],
        "Электрическое поле. Напряженность электрического поля.": ["images/pole1.jpg", "images/pole2.jpg"],
        "Элементарный заряд. Строение атома.": ["images/atom1.jpg", "images/atom2.jpg"],
        "Закон сохранения электрического заряда.": ["images/sohran_zaryada.jpg"],
        "Сила тока. Амперметр.": ["images/sila_toka.jpg"],
        "Напряжение. Вольтметр.": ["images/napryag.jpg"],
        "Сопротивление.Удельное сопротивление.": ["images/soprot1.jpg", "images/soprot2.jpg"],
        "Закон Ома.": ["images/om.jpg"]
    };

    // Функция получения текста
    function getExplanation(topicName) {
        return explanationTexts[topicName] || "место для объяснения";
    }

    // Генерация HTML
    const container = document.getElementById('chaptersContainer');
    let htmlString = '';

    chapters.forEach((chapter, chapterIdx) => {
        htmlString += `<div class="chapter" id="chapter-${chapterIdx}"><h2>${chapter.title}</h2>`;

        // Оглавление главы
        htmlString += `<div class="chapter-toc"><span>📚 Темы главы:</span><div class="toc-links">`;
        chapter.topics.forEach((topic, topicIdx) => {
            const topicId = `topic-${chapterIdx}-${topicIdx}`;
            htmlString += `<a href="#${topicId}">${topic}</a>`;
        });
        htmlString += `</div></div>`;

        htmlString += `<div class="topics-grid">`;

        chapter.topics.forEach((topic, topicIdx) => {
            const topicId = `topic-${chapterIdx}-${topicIdx}`;
            const explanation = getExplanation(topic);
            const images = topicImages[topic] || [];

            htmlString += `<div class="topic-card" id="${topicId}">`;
            htmlString += `<div class="topic-title"><span>📘</span>${topic}</div>`;
            htmlString += `<div class="explanation">${explanation.replace(/\n/g, '<br>')}</div>`;

            htmlString += `<div class="images-section">`;
            if (images.length === 0) {
                htmlString += `<div class="image-placeholder"><i>🖼️</i> нет изображений</div>`;
            } else {
                images.forEach((src) => {
                    // ВАЖНО: исправленное экранирование — используем \' внутри строки
                    htmlString += `<img src="${src}" alt="иллюстрация к ${topic}" title="путь: ${src}" onclick="openModal('${src}')" onerror="this.onerror=null; this.outerHTML='<div class=\'image-placeholder\'><i>⚠️</i> файл &#39;${src}&#39; не найден</div>';">`;
                });
            }
            htmlString += `</div>`; // images-section
            htmlString += `</div>`; // topic-card
        });

        htmlString += `</div></div>`; // topics-grid и chapter
    });

    container.innerHTML = htmlString;

    // ---------- ЛОГИКА КНОПКИ "НАЧАТЬ ИЗУЧЕНИЕ" ----------
    const startBtn = document.getElementById('startBtn');
    const welcome = document.getElementById('welcomeBlock');
    const navPanel = document.getElementById('navPanel');
    const chaptersContainer = document.getElementById('chaptersContainer');

    startBtn.addEventListener('click', () => {
        chaptersContainer.classList.add('visible');
        navPanel.classList.add('visible');
        welcome.style.opacity = '0.3';
        welcome.style.transform = 'scale(0.98)';
        welcome.style.pointerEvents = 'none';
        setTimeout(() => {
            chaptersContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
    });

    // ---------- НАВИГАЦИЯ ПО ГЛАВАМ (КНОПКИ СВЕРХУ) ----------
    const navButtons = document.querySelectorAll('.nav-chapter');
    navButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const chapterIndex = this.getAttribute('data-chapter');
            const targetChapter = document.getElementById(`chapter-${chapterIndex}`);
            navButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            if (targetChapter) {
                targetChapter.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });

    // ---------- МОДАЛЬНОЕ ОКНО ДЛЯ КАРТИНОК ----------
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.getElementById('modalClose');

    window.openModal = function(src) {
        modal.classList.add('active');
        modalImg.src = src;
    };

    closeBtn.onclick = function() {
        modal.classList.remove('active');
        modalImg.src = '';
    };

    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.classList.remove('active');
            modalImg.src = '';
        }
    };

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            modal.classList.remove('active');
            modalImg.src = '';
        }
    });

    // ---------- КНОПКА "НАВЕРХ" ----------
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            scrollTopBtn.classList.add('visible');
        } else {
            scrollTopBtn.classList.remove('visible');
        }
    });
    scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
})();
</script>
</body>
</html>
